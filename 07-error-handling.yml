- name: Error Handling
  hosts: localhost
  connection: local
  tasks:
    - name: Task1
      ansible.builtin.shell: cat /etc/passwd | grep demo
      ignore_errors: true
    - name: Task2
      ansible.builtin.shell: ls
      register: out
    - name: Print Task2
      ansible.builtin.debug:
        msg: "{{ out }}"